[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "docling>=2.121.0",
    "docling-core>=2.92.0",
    "groq>=1.7.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "pypdf>=6.4.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
    "streamlit>=1.62.0",
    "transformers>=5.8.1",
]

[project.scripts]
rag = "rag.main:main"
rag-embed-query = "rag.retrieval.query_embedder:main"
rag-search = "rag.retrieval.retriever:main"
rag-ui = "rag.ui:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
